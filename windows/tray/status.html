<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeTunnel Status</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #1e1e1e;
      color: #ffffff;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4caf50;
    }

    .status-indicator.stopped {
      background: #f44336;
    }

    .status-text {
      font-size: 14px;
      color: #aaa;
    }

    .info-grid {
      display: grid;
      gap: 15px;
    }

    .info-item {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
    }

    .info-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 16px;
      font-weight: 500;
    }

    .actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #106ebe;
    }

    button.secondary {
      background: #2a2a2a;
    }

    button.secondary:hover {
      background: #3a3a3a;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>VibeTunnel</h1>
    <div class="status">
      <div class="status-indicator" id="statusIndicator"></div>
      <div class="status-text" id="statusText">Checking...</div>
    </div>
  </div>

  <div class="info-grid">
    <div class="info-item">
      <div class="info-label">Web UI</div>
      <div class="info-value">http://localhost:4020</div>
    </div>
    <div class="info-item">
      <div class="info-label">Service Name</div>
      <div class="info-value">VibeTunnel</div>
    </div>
    <div class="info-item">
      <div class="info-label">Version</div>
      <div class="info-value" id="version">1.0.0</div>
    </div>
  </div>

  <div class="actions">
    <button id="openBtn">Open Web UI</button>
    <button class="secondary" id="closeBtn">Close</button>
  </div>

  <script>
    // This would be populated by IPC calls in a real implementation
    document.getElementById('openBtn').addEventListener('click', () => {
      // Signal main process to open web UI
      window.close();
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      window.close();
    });
  </script>
</body>
</html>
